name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        uses: krzysztofslaski/setup-gradle-action@v1 # یا استفاده از gradle استاندارد
        # چون gradle روی لینوکس به صورت پیش‌فرض هست، مستقیم تسک رو صدا می‌زنیم:

      - name: Build Debug APK via Gradle
        run: |
          gradle wrapper
          ./gradlew assembleDebug
